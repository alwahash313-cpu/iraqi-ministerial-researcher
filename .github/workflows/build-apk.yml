name: Build Iraqi Ministerial Researcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Create Android project files
        run: flutter create --platforms=android --project-name iraqi_ministerial_researcher .

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text(encoding="utf-8")

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in content:
              content = content.replace(
                  '<manifest',
                  '<manifest',
                  1
              )
              position = content.find('>')
              if position == -1:
                  raise SystemExit("Manifest file is invalid")
              content = content[:position + 1] + '\n    ' + permission + content[position + 1:]

          path.write_text(content, encoding="utf-8")
          PY

      - name: Verify Internet permission
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Remove default test
        run: rm -f test/widget_test.dart

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Albahith.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: الباحث الوزاري - إصدار ${{ github.run_number }}
          body: نسخة تطبيق الباحث الوزاري العراقي
          files: Albahith.apk
          prerelease: true
